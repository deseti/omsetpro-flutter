  <!-- ================== PERBAIKAN: TAMBAHKAN SCRIPT INI ================== -->
  <!-- Script ini memuat library Midtrans Snap.js untuk platform web -->
  <script 
    type="text/javascript"
    src="https://app.sandbox.midtrans.com/snap/snap.js"
    data-client-key="Mid-client-Pqcy5qa-KoOoRDpd"
    onload="console.log('✅ Snap.js loaded successfully');"
    onerror="console.error('❌ Failed to load Snap.js');">
  </script>
  
  <!-- Script untuk menangani pembayaran Snap.js -->
  <script type="text/javascript">
    // Variable untuk track loading state
    let snapLoadAttempts = 0;
    const maxSnapLoadAttempts = 10;
    
    // Fungsi untuk check apakah Snap.js sudah ter-load
    function checkSnapReady() {
      const isReady = typeof window.snap !== 'undefined' && 
                      window.snap && 
                      typeof window.snap.pay === 'function';
      console.log(`🔍 Snap.js ready check: ${isReady}`, {
        windowSnap: typeof window.snap,
        snapPay: window.snap ? typeof window.snap.pay : 'N/A'
      });
      return isReady;
    }
    
    // Fungsi untuk wait hingga Snap.js ready dengan timeout
    function waitForSnapReady(callback, timeout = 15000) {
      const startTime = Date.now();
      
      function checkReady() {
        if (checkSnapReady()) {
          console.log('✅ Snap.js is ready after', Date.now() - startTime, 'ms');
          callback(true);
          return;
        }
        
        if (Date.now() - startTime > timeout) {
          console.error('❌ Snap.js load timeout after', timeout, 'ms');
          callback(false);
          return;
        }
        
        // Check lagi setelah 100ms
        setTimeout(checkReady, 100);
      }
      
      checkReady();
    }
    
    // Fungsi utama untuk pembayaran
    function snapPay(snapToken, callback) {
      console.log('🔍 Starting snapPay with token:', snapToken ? snapToken.substring(0, 20) + '...' : 'null');
      
      // Jika Snap.js sudah ready, langsung jalankan
      if (checkSnapReady()) {
        console.log('✅ Snap.js already ready, executing payment');
        executeSnapPayment(snapToken, callback);
        return;
      }
      
      // Jika belum ready, tunggu hingga ready
      console.log('⏳ Waiting for Snap.js to be ready...');
      waitForSnapReady((isReady) => {
        if (isReady) {
          executeSnapPayment(snapToken, callback);
        } else {
          console.error('❌ Snap.js failed to load within timeout');
          if (callback) {
            callback({
              status: 'error',
              message: 'Snap.js gagal dimuat. Silakan refresh halaman dan coba lagi.',
              error: 'Snap.js load timeout'
            });
          }
        }
      });
    }
    
    // Fungsi untuk execute payment setelah Snap.js ready
    function executeSnapPayment(snapToken, callback) {
      try {
        console.log('🚀 Executing Snap payment...');
        window.snap.pay(snapToken, {
            onSuccess: function(result) {
              console.log('✅ Payment success callback triggered:', result);
              if (callback) {
                const response = {
                  status: 'success', 
                  result: result,
                  message: 'Payment completed successfully'
                };
                console.log('📤 Sending success response to Flutter:', response);
                callback(response);
              }
            },
            onPending: function(result) {
              console.log('⏳ Payment pending callback triggered:', result);
              if (callback) {
                const response = {
                  status: 'pending', 
                  result: result,
                  message: 'Payment is pending'
                };
                console.log('📤 Sending pending response to Flutter:', response);
                callback(response);
              }
            },
            onError: function(result) {
              console.log('❌ Payment error callback triggered:', result);
              if (callback) {
                const response = {
                  status: 'error', 
                  result: result,
                  message: 'Payment failed',
                  error: result
                };
                console.log('📤 Sending error response to Flutter:', response);
                callback(response);
              }
            },
            onClose: function() {
              console.log('🚪 Payment popup closed by user');
              if (callback) {
                const response = {
                  status: 'closed',
                  message: 'Payment popup was closed by user'
                };
                console.log('📤 Sending close response to Flutter:', response);
                callback(response);
              }
            }
          });
      } catch (error) {
        console.error('❌ Error calling snap.pay:', error);
        if (callback) {
          const response = {
            status: 'error', 
            message: 'Error calling Snap.js: ' + error.message,
            error: error.toString()
          };
          console.log('📤 Sending exception response to Flutter:', response);
          callback(response);
        }
      }
    }
    
    // Legacy function untuk backward compatibility
    function snap(action, snapToken, callback) {
      if (action === 'pay') {
        snapPay(snapToken, callback);
      } else {
        console.error('❌ Invalid action:', action);
        if (callback) callback({status: 'error', message: 'Invalid action'});
      }
    }
    
    // Wait untuk Snap.js ter-load
    window.addEventListener('load', function() {
      setTimeout(function() {
        if (checkSnapReady()) {
          console.log('✅ Snap.js fully loaded and ready');
        } else {
          console.error('❌ Snap.js failed to load after page load');
        }
      }, 1000);
    });
  </script>
  <!-- ====================================================================== -->

</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
