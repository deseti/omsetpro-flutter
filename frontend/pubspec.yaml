name: omsetpro
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Untuk state management
  flutter_riverpod: ^2.5.1

  # Untuk komunikasi API
  dio: ^5.4.3+1
  http: ^1.4.0

  # --- TAMBAHKAN BARIS INI (VERSI SUDAH DIPERBAIKI) ---
  midtrans_sdk: ^1.0.1

  # Untuk komunikasi real-time (WebSocket)
  socket_io_client: ^2.0.3

  # Untuk memilih gambar dari galeri/kamera
  image_picker: ^1.1.2

  # Untuk menyimpan data sesi login secara persisten
  shared_preferences: ^2.2.3

  # Untuk memilih file dari penyimpanan (Excel, dll)
  file_picker: ^8.0.5
  
  # Untuk scan barcode via kamera
  mobile_scanner: ^5.1.1

  # Untuk offline storage (local database)
  sqflite: ^2.3.3+1
  path_provider: ^2.1.4
  path: ^1.9.0
  
  # Untuk cek koneksi internet
  connectivity_plus: ^6.0.5

  # Untuk format tanggal dan mata uang
  intl: ^0.19.0


  # Untuk membuat grafik dan chart yang cantik
  fl_chart: ^0.68.0

  # Ikon bawaan gaya iOS
  cupertino_icons: ^1.0.8

  # Untuk multiselect widget yang lebih baik
  multiselect_formfield: ^0.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  
  # Generate app localization (untuk format tanggal dan angka)
  generate: true
