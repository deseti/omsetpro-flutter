# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# The following line activates a set of recommended lints for Flutter apps,
# packages, and plugins designed to encourage good coding practices.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/test_auth_debug.dart"  # Ignore debug files
  errors:
    # Treat certain warnings as errors
    invalid_assignment: error
    # Demote certain lints from error to warning/info
    missing_return: warning
    # Ignore certain warnings completely
    unused_import: ignore  # Allow unused imports
    unused_element: ignore  # Allow unused elements
    deprecated_member_use: ignore  # Allow deprecated methods for compatibility

linter:
  # The lint rules applied to this project can be customized in the
  # section below to disable rules from the `package:flutter_lints/flutter.yaml`
  # included above or to enable additional rules. A list of all available lints
  # and their documentation is published at https://dart.dev/lints.
  #
  # Instead of disabling a lint rule for the entire project in the
  # section below, it can also be suppressed for a single line of code
  # or a specific dart file by using the `// ignore: name_of_lint` and
  # `// ignore_for_file: name_of_lint` syntax on the line or in the file
  # producing the lint.
  rules:
    # ========== DISABLED RULES (to reduce noise) ==========
    avoid_print: false  # Allow print statements for development/debugging
    constant_identifier_names: false  # Allow ALL_CAPS for constants like PERCENTAGE, NOMINAL
    library_private_types_in_public_api: false  # Allow private types in public APIs
    library_prefixes: false  # Allow non-lowercase import prefixes like OfflineDatabase
    use_build_context_synchronously: false  # Allow BuildContext usage across async gaps (you handle it manually)
    
    # ========== ENABLED RULES (important for code quality) ==========
    prefer_single_quotes: true  # Use single quotes for strings
    prefer_const_constructors: true  # Use const constructors when possible
    prefer_const_declarations: true  # Use const for final variables
    sort_child_properties_last: true  # Put child parameter last in widget constructors
    curly_braces_in_flow_control_structures: true  # Always use braces in if/for/while
    
    # ========== OPTIONAL RULES (can enable later) ==========
    # use_super_parameters: true  # Use super parameters when possible
    # prefer_final_locals: true  # Prefer final for local variables
    # prefer_final_fields: true  # Prefer final for fields

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
